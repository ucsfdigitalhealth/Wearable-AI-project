name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project WearableAI.xcodeproj \
            -scheme WearableAI \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Take screenshots
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/WearableAI.app
          BUNDLE_ID=edu.wearableai.WearableAI
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for d in items:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for tab in live device sessions settings; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -demoTab "$tab" -demoConnect YES
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$tab.png"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/screenshots/
          if-no-files-found: ignore
