# Fallback: if WearableAI.xcodeproj won't open, run `brew install xcodegen && xcodegen`
# in this folder to regenerate the project.
name: WearableAI
options:
  bundleIdPrefix: edu.wearableai
  deploymentTarget:
    iOS: "17.0"
targets:
  WearableAI:
    type: application
    platform: iOS
    sources: [WearableAI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.wearableai.WearableAI
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "WearableAI uses Bluetooth to connect to your Polar Verity Sense."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
